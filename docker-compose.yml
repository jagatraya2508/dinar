services:
  dinarweb:
    build: .
    container_name: dinarweb
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - ./data:/app/data
      - ./assets/web/uploads:/app/assets/web/uploads
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=3002
